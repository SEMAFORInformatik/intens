[project]
name = "api-gateway"
version = "0.1.0"
classifiers = ["private :: do not upload"]
description = "api gateway for scim"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "mako>=1.3.10",
    "matplotlib>=3.10.8",
    "opentelemetry-distro>=0.60b1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1",
    "pyzmq>=27.1.0",
    "scipy>=1.17.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

#[build-system]
#requires=["uv_build>0.8"]
#build-backend = "uv_build"
[tool.hatch.build.targets.wheel.force-include]
"." = "pkg"
"api-gateway.py" = "pkg/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = [
  "./api-gateway.py", "./config.py", 
  "tractools", "zrpc"
]
[tool.hatch.build.targets.wheel]
packages = ["tractools", "zrpc"]

[tool.uv.build-backend]
module-name = ["tractools", "zrpc"]
module-root = ""
source-include = ["api-gateway.py", "config.py"]